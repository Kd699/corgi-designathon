<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The daily open — Corgi Designathon</title>
    <!-- Work Sans: the source project renders in Perkbox's licensed brand font, with Work
         Sans as its declared fallback. Shipping the brand font outside Perkbox is not ours
         to do, so the fallback is the font here — same shapes, nothing to license. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Agentation Send guard: a plain classic script, so it loads before the app bundle
         and Vite's HMR can never detach it. If the toolbar's own Send handler dies, this
         still gets your annotation to the bridge. See public/agentation-send-guard.js. -->
    <script src="/agentation-send-guard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
